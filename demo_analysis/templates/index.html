<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS-Net Demo Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">

    <!-- === Header === -->
    <header class="app-header">
      <div class="header-top">
        <a class="header-brand" href="https://github.com/Gary2005/cs-net" target="_blank" rel="noopener">
          <img class="header-logo" src="{{ url_for('asset_file', filename='logo.svg') }}" alt="" />
          <div>
            <div class="header-name">CS-NET</div>
            <div class="header-label">CS2 Demo Analyzer</div>
          </div>
        </a>
        <span class="lang-wrap">🌐 <select id="app-language" class="lang-select">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
        </select></span>
      </div>

      <form id="analyze-form" class="header-form">
        <div class="upload-zone" id="upload-zone">
          <div class="upload-icon">📁</div>
          <div class="upload-text">选择 .dem 文件或拖拽到此处</div>
          <input type="file" name="demo_file" id="demo-file" accept=".dem" required />
        </div>

        <div class="settings-row">
          <div class="setting">
            <label>模型目录</label>
            <input type="text" name="model_path" id="model-path" value="{{ default_model_path }}" list="model-path-list" autocomplete="off" placeholder="cs-net-models 根目录" />
            <datalist id="model-path-list">
              {% for p in model_options %}
              <option value="{{ p }}"></option>
              {% endfor %}
            </datalist>
          </div>
          <div class="setting">
            <label>设备</label>
            <select name="device" id="device">
              <option value="cuda" {% if default_device == "cuda" %}selected{% endif %}>cuda</option>
              <option value="cpu" {% if default_device == "cpu" %}selected{% endif %}>cpu</option>
            </select>
          </div>
          <div class="setting">
            <label>Batch Size</label>
            <input type="number" name="batch_size" id="batch-size" value="256" min="1" max="512" />
          </div>
        </div>

        <div class="actions-row">
          <button id="analyze-btn" type="submit">▶ 开始分析</button>
          <div class="actions-sub">
            <button id="load-json-btn" type="button" class="link-btn">加载 JSON</button>
            <button id="download-json-btn" type="button" class="link-btn hidden">下载 JSON</button>
            <input type="file" name="json_file" id="json-file" accept=".json" hidden />
          </div>
        </div>
      </form>
    </header>

    <!-- === Main Grid (hidden until analysis done) === -->
    <div class="app-main hidden" id="app-main">

      <!-- Left Column: Radar → Playback → Chart -->
      <div class="main-left">
        <div class="left-top">
          <div id="match-badge" class="match-badge"></div>
          <div id="round-tabs" class="round-tabs"></div>
        </div>

        <div class="radar-section" id="tick-view">
          <div class="radar-wrapper" id="radar-wrapper"></div>
          <div class="radar-legend">
            <span class="legend-item"><span class="swatch ct"></span>CT</span>
            <span class="legend-item"><span class="swatch t"></span>T</span>
            <span class="legend-item"><span class="swatch dead"></span>阵亡</span>
            <span class="legend-item"><span class="swatch flashed"></span>被闪</span>
            <span class="legend-item"><span class="swatch duel-line"></span>对决连线</span>
            <span class="legend-item"><span class="swatch util-smoke"></span>烟雾</span>
            <span class="legend-item"><span class="swatch util-fire"></span>燃烧</span>
            <span class="legend-item"><span class="swatch util-nade"></span>手雷</span>
          </div>
        </div>

        <!-- Playback Controls -->
        <div class="playback-bar" id="playback-bar">
          <button id="pb-rewind" class="pb-btn" title="跳到开头">⏮</button>
          <button id="pb-play" class="pb-btn pb-play" title="播放 / 暂停">▶</button>
          <button id="pb-forward" class="pb-btn" title="跳到结尾">⏭</button>
          <span id="pb-time" class="pb-time">00:00 / 00:00</span>
          <input type="range" id="pb-slider" class="pb-slider" min="0" max="100" value="0" />
          <select id="pb-speed" class="pb-speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
          </select>
        </div>

      </div>

      <!-- Right Column: Chart + Tabbed Data Panels -->
      <div class="main-right">
        <div id="chart" class="chart"></div>

        <nav class="tab-nav" id="tab-nav">
          <button class="tab-btn active" data-tab="hover">悬停数据</button>
          <button class="tab-btn" data-tab="round">回合总结</button>
          <button class="tab-btn" data-tab="overall">全场平均</button>
          <button class="tab-btn" data-tab="advanced">高级指标</button>
          <button class="tab-btn" data-tab="chat">AI 对话</button>
        </nav>

        <div class="tab-panels" id="tab-panels">
          <!-- Hover Stats -->
          <div class="tab-panel active" id="tab-hover">
            <div id="hover-player-stats" class="hover-player-stats"></div>
          </div>

          <!-- Round Summary -->
          <div class="tab-panel" id="tab-round">
            <div id="round-summary-view">
              <div id="round-summary-table"></div>
            </div>
          </div>

          <!-- Overall Summary -->
          <div class="tab-panel" id="tab-overall">
            <div id="overall-summary-view">
              <div id="overall-summary-table"></div>
            </div>
          </div>

          <!-- Advanced Metrics -->
          <div class="tab-panel" id="tab-advanced">
            <div id="advanced-metrics-view">
              <button id="advanced-toggle" type="button" class="ghost-btn">展开/收起</button>
              <div id="advanced-metrics-body" class="advanced-body"></div>
            </div>
          </div>

          <!-- AI Chat -->
          <div class="tab-panel" id="tab-chat">
            <div id="llm-view">
              <div class="chat-config">
                <label><span>API Key</span><input type="password" id="llm-api-key" placeholder="sk-..." /></label>
                <label><span>模型</span><input type="text" id="llm-model" placeholder="gpt-4.1 / deepseek-chat / qwen-max" /></label>
                <label><span>Base URL</span><input type="text" id="llm-base-url" value="https://api.openai.com/v1" /></label>
                <label><span>Temperature</span><input type="number" id="llm-temperature" step="0.1" min="0" max="1.5" value="0.95" /></label>
              </div>
              <button id="chat-init-btn" type="button">开始分析对话</button>
              <div id="chat-area" class="chat-area hidden">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                  <input type="text" id="chat-input" placeholder="输入问题，如：哪个玩家表现最好？" />
                  <button id="chat-send-btn" type="button">发送</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === Status Bar === -->
    <pre id="status-log" class="status-bar">等待上传 DEM...</pre>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="{{ url_for('static', filename='radar.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
